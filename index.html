<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khushi Shanker — Marketing Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141311;
    --bone:#F3EEE2;
    --paper:#FBF8F1;
    --signal:#FF4B1F;
    --sage:#4A5A3A;
    --line: rgba(20,19,17,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(251,248,241,0.88);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:72px;}
  .nav-name{ font-family:'Fraunces', serif; font-size:20px; font-weight:600;}
  .nav-links{ display:flex; gap:28px; font-size:14px; }
  .nav-links a{ position:relative; padding-bottom:2px; }
  .nav-links a::after{
    content:""; position:absolute; left:0; bottom:-4px; width:0; height:1px; background:var(--signal);
    transition:width .25s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  .nav-cta{
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:100px; font-size:13px;
    letter-spacing:0.02em;
  }

  .hero{
    position:relative; overflow:hidden;
    padding:72px 0 64px;
    border-bottom:1px solid var(--line);
  }
  .hero-grid{
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:center;
  }
  .hero h1{
    font-size:clamp(42px, 6vw, 78px);
    line-height:1.04;
    font-weight:500;
  }
  .hero h1 em{ font-style:italic; color:var(--signal); font-weight:500; }
  .hero-sub{
    margin-top:26px; font-size:18px; line-height:1.65; max-width:54ch; color:#3a382f;
  }
  .hero-actions{ margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 24px; border-radius:100px; font-size:14px; font-weight:600;
    border:1px solid var(--ink); transition:all .2s ease;
  }
  .btn-solid{ background:var(--ink); color:var(--paper); }
  .btn-solid:hover{ background:var(--signal); border-color:var(--signal); }
  .btn-outline{ background:transparent; color:var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:var(--paper); }

  .hero-photo{
    position:relative; aspect-ratio:3/4; border-radius:6px; overflow:hidden;
    background:#1c1b18;
  }
  .hero-photo img{ width:100%; height:100%; object-fit:cover; }
  .hero-photo .frame-label{
    position:absolute; bottom:16px; left:16px; color:var(--bone);
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    text-shadow:0 1px 6px rgba(0,0,0,0.5);
  }
  .hero-photo .dot{ width:7px; height:7px; border-radius:50%; background:var(--signal); }

  .section{ padding:88px 0; border-bottom:1px solid var(--line); position:relative;}
  .section.dark{ background:var(--ink); color:var(--bone); border-bottom:1px solid rgba(243,238,226,0.12); }
  .section.dark .section-title{ color:var(--bone); }
  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:52px; flex-wrap:wrap;}
  .section-num{
    font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:var(--signal); font-weight:600; margin-bottom:10px; display:block;
  }
  .section-title{
    font-size:clamp(32px,4vw,52px); font-weight:500;
  }

  .about-grid{ display:grid; grid-template-columns:0.9fr 1.4fr; gap:64px; align-items:start;}
  .about-lead{ font-size:24px; line-height:1.5; font-family:'Fraunces',serif; font-weight:400;}
  .about-body p{ font-size:16px; line-height:1.75; color:#3a382f; margin-bottom:18px; }
  .about-tags{ display:flex; flex-wrap:wrap; gap:10px; margin-top:24px;}
  .tag{ border:1px solid var(--line); padding:8px 16px; border-radius:100px; font-size:13px; color:var(--ink);}

  .skills-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .skills-col{ padding:0; }
  .skills-col + .skills-col{ border-left:1px solid var(--line); }
  .skills-col-head{ padding:22px 28px; border-bottom:1px solid var(--line); background:var(--bone);}
  .skills-col-head h3{ font-size:15px; text-transform:uppercase; letter-spacing:0.08em; font-weight:600; font-family:'Space Grotesk',sans-serif;}
  .cert-row{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); gap:16px;}
  .cert-row:last-child{ border-bottom:none; }
  .cert-row .cert-name{ font-family:'Fraunces',serif; font-size:17px; }
  .cert-row .cert-issuer{ font-size:12px; color:#78766b; margin-top:3px;}
  .cert-badge{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--signal); font-weight:600; white-space:nowrap;}

  .do-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .do-card{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; overflow:hidden;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .do-card:hover{ transform:translateY(-6px); box-shadow:0 20px 40px rgba(20,19,17,0.1);}
  .do-card-visual{
    height:170px; background:var(--ink); position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .do-card-visual span{ font-family:'Fraunces',serif; font-style:italic; color:rgba(243,238,226,0.5); font-size:15px;}
  .do-card-body{ padding:26px; }
  .do-card-body h3{ font-size:22px; margin-bottom:10px;}
  .do-card-body p{ font-size:14px; color:#5a584d; line-height:1.6; margin-bottom:18px;}
  .do-link{ font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; border-bottom:1px solid var(--signal); padding-bottom:2px;}

  .case{
    display:grid; grid-template-columns:0.85fr 1.15fr; gap:56px; align-items:center; padding:64px 0;
    border-bottom:1px solid rgba(243,238,226,0.12);
  }
  .case:last-child{ border-bottom:none; padding-bottom:0;}
  .case:first-of-type{ padding-top:0; }
  .case.reverse{ direction:rtl; }
  .case.reverse > *{ direction:ltr; }
  .case-tag{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--signal); font-weight:600; margin-bottom:14px; display:block;}
  .case h3{ font-size:clamp(24px,2.8vw,32px); margin-bottom:16px; color:var(--bone);}
  .case p{ font-size:15px; line-height:1.75; color:rgba(243,238,226,0.72); margin-bottom:24px;}
  .case-visual{
    aspect-ratio:4/3; border-radius:8px; overflow:hidden; position:relative;
    border:1px solid rgba(243,238,226,0.14); background:#1c1b18;
    display:flex; align-items:center; justify-content:center;
  }
  .case-visual img{ width:100%; height:100%; object-fit:cover; }
  .case-visual.contain img{ object-fit:contain; padding:24px; background:#fff; }

  .contact-section{ background:var(--ink); color:var(--bone); border-bottom:none; padding-bottom:64px;}
  .contact-title{
